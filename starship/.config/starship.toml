format = """
$directory\
$git_branch\
$git_status\
$c\
$rust\
$nodejs\
$package\
$cmd_duration\
$line_break\
$character"""

[directory]
truncation_length = 3
truncation_symbol = ".../"
style = "bold blue"

[git_branch]
format = "[$symbol$branch]($style) "
symbol = " "
style = "purple"

[git_status]
format = '([$all_status$ahead_behind]($style) )'
style = "red"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"

[c]
format = "[$symbol($version)]($style) "
symbol = " "
style = "149"

[rust]
format = "[$symbol($version)]($style) "
symbol = " "
style = "208"

[nodejs]
format = "[$symbol($version)]($style) "
symbol = " "
style = "green"

[package]
format = "[$symbol$version]($style) "
symbol = " "
style = "208"

[cmd_duration]
min_time = 2000
format = "[$duration]($style) "
style = "yellow"
