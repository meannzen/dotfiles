set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g mouse on

unbind C-b
set -g prefix C-s
bind C-s send-prefix

# ── Vim-style pane navigation ───────────────────────
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Splits (| for vertical, - for horizontal, in current path)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# New window in current path
bind c new-window -c "#{pane_current_path}"

# Resize panes with arrow keys
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Quick session switching
bind s choose-tree -sZ

# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded"

# Start windows and panes at 1
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Resurrect & Continuum (auto-save/restore sessions)
set -g @continuum-restore 'on'
set -g @resurrect-capture-pane-contents 'on'

# ── Status bar ──────────────────────────────────────
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=default,fg=#565f89"
set -g status-left-length 40
set -g status-right-length 80

# Left: session name in a subtle pill
set -g status-left "#[fg=#1a1b26,bg=#7aa2f7,bold]  #S #[fg=#7aa2f7,bg=default,nobold] "

# Right: branch + time
set -g status-right "#[fg=#33354a,bg=default]#[fg=#565f89,bg=#33354a]  #(cd #{pane_current_path}; git branch --show-current 2>/dev/null || echo '-') #[fg=#7aa2f7,bg=#33354a]#[fg=#1a1b26,bg=#7aa2f7,bold] %H:%M "

# Window tabs
set -g window-status-separator ""
set -g window-status-format "#[fg=#33354a,bg=default]#[fg=#565f89,bg=#33354a] #(echo #{window_index} | awk '{split(\"I II III IV V VI VII VIII IX X XI XII XIII XIV XV XVI XVII XVIII XIX XX\", r, \" \"); print r[$1+1]}')  #{window_name} #[fg=#33354a,bg=default]"
set -g window-status-current-format "#[fg=#7aa2f7,bg=default]#[fg=#1a1b26,bg=#7aa2f7,bold] #(echo #{window_index} | awk '{split(\"I II III IV V VI VII VIII IX X XI XII XIII XIV XV XVI XVII XVIII XIX XX\", r, \" \"); print r[$1+1]}')  #{window_name} #[fg=#7aa2f7,bg=default]"

# Pane borders
set -g pane-border-style "fg=#33354a"
set -g pane-active-border-style "fg=#7aa2f7"

# Message style
set -g message-style "fg=#7aa2f7,bg=#1a1b26"

# Bootstrap tpm if not installed
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

run '~/.tmux/plugins/tpm/tpm'
